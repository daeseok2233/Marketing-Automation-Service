# config.yaml — 브랜드 및 서비스 설정
service_name: "(주)마크클라우드"
service_desc: "AI 기반 상표 검색(마크뷰) + 출원 대행(마크픽) + 마크패스(법률문서 자동작성) IP 종합 관리 플랫폼"
brand_label: "마크클라우드"
# service_name: "jay.pm"
# service_desc: "AI 시대, PM·마케터·1인 사업자를 위한 실전 전략과 도구 활용 콘텐츠"
# brand_label: "AI 위클리"

# 카드뉴스 설정
card_count: 5
thumbnail_line_count: 3
thumbnail_char_min: 7
thumbnail_char_max: 12

# 텍스트 생성 모델 설정
# provider: "openai" 또는 "anthropic"
# model: 사용할 모델 ID
text_model:
  provider: "openai"
  model: "gpt-4o-mini"
  # provider: "anthropic"
  # model: "claude-sonnet-4-20250514"

# 자기 평가 기준 점수 (10점 만점, 이 점수 미만이면 재생성)
quality_threshold: 7

# 최대 재생성 횟수
max_retries: 3

# 마케팅 앵글 목록
angles:
  - name: "공감"
    english: "Empathy"
    # description: "나도 그랬어요 — 독자의 경험에 공감하며 시작"    
    # description: "독자의 경험에 공감하며 시작하는 방식"
    description: "독자의 경험에 공감하며 시작. 타겟 감정: '나도 그래!'. 친근한 말투로, 가르치려 하지 말 것."
  - name: "두려움"
    english: "Fear"
    # description: "이렇게 안 하면 놓치게 됩니다 — 손실 회피 심리 활용"
    # description: "놓치면 손해라는 손실 회피 심리를 활용하는 방식"
    description: "행동하지 않으면 생기는 리스크를 환기. 타겟 감정: 불안, 조급함. 과장하지 말고 현실적 위험을 짚을 것."
  - name: "혜택"
    english: "Benefit"
    # description: "이 방법을 쓰면 3배 빨라집니다 — 구체적 이익 제시"
    # description: "구체적인 이익과 결과를 제시하는 방식"
    description: "얻을 수 있는 구체적 결과를 제시. 타겟 감정: 기대감. 추상적 표현 대신 체감 가능한 변화를 보여줄 것."
  - name: "편의"
    english: "Convenience"
    # description: "5분이면 충분합니다 — 쉽고 간단함 강조"
    # description: "쉽고 간단하게 할 수 있다는 점을 강조하는 방식"
    description: "진입장벽이 낮다는 점을 강조. 타겟 감정: 안도감. 어렵거나 부담스럽게 느껴지지 않도록 할 것."
  - name: "사회증거"
    english: "Social Proof"
    # description: "이미 1000명이 사용 중입니다 — 다른 사람들의 선택 강조"
    # description: "다른 사람들의 선택을 강조해 신뢰감을 주는 방식"
    description: "이미 많은 사람이 선택했다는 신뢰감 부여. 타겟 감정: 소외 불안. 구체적 숫자는 서비스 실제 데이터 기반으로만 사용할 것."

# GCP 프로젝트 ID (Imagen 이미지 생성용)
gcp_project_id: "cardnews-agent-492005"

# 구글 시트 설정
google_sheet:
  sheet_url: "https://docs.google.com/spreadsheets/d/1zoU6QPmiFE3Iz0_PW9lh-K2S3ggXVsoSiqE54d_jBYU/edit?gid=0#gid=0"
  creds_file: "credentials.json"
  worksheet_name: "카드뉴스 결과물"

# 피그마 로컬 서버 포트
figma_server_port: 8765
